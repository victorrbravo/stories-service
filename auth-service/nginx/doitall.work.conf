server {
    server_name doitall.work;

    # Go service still owns its own login endpoint (web/http-server.go).
    location = /auth/login {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # better-auth service (docker compose, AUTH_PORT=7070). No URI on proxy_pass,
    # so the path reaches the service unchanged: /auth/sign-in/email -> /auth/sign-in/email.
    location /auth/ {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) so clients can't spoof their IP past the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/bot_api_access.log;
    error_log /var/log/nginx/bot_api_error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/doitall.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doitall.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
