version: '3.9'

services:
  postgres:
    image: postgis/postgis:latest
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data # Persist data using a named volume
    environment:
      - POSTGRES_PASSWORD=stories
      - POSTGRES_USER=stories
      - POSTGRES_DB=stories
  adminer:
    image: adminer
    container_name: my-adminer-container
    ports:
      - "8080:8080"
    depends_on:
      - postgres
volumes:
  pgdata:
